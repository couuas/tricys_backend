<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Parser Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .column { flex: 1; }
        textarea { width: 100%; height: 300px; }
        pre { background: #f0f0f0; padding: 10px; overflow: auto; height: 300px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Manual Test: Layout Parsing</h1>
    
    <div class="container">
        <div class="column">
            <h3>Input Modelica Code</h3>
            <textarea id="modelInput">
model Cycle
  Plasma plasma annotation(origin={-10, 20});
  Tritium_Storage sds annotation(origin={30, -40});
  equation
    connect(plasma.out, sds.in);
end Cycle;

model Plasma
  parameter Real fb = 0.05;
end Plasma;
            </textarea>
            <br><br>
            <button onclick="parseContent()">Parse Content</button>
        </div>
        
        <div class="column">
            <h3>Result (JSON)</h3>
            <pre id="resultOutput">...</pre>
        </div>
    </div>

    <script>
        async function parseContent() {
            const content = document.getElementById('modelInput').value;
            const output = document.getElementById('resultOutput');
            
            output.textContent = "Parsing...";
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/parse_content', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: content
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                output.textContent = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
